# ─────────────────────────────────────────────
# EventSphere - Nginx Configuration
# Place at: /etc/nginx/sites-available/eventsphere
# Then: sudo ln -s /etc/nginx/sites-available/eventsphere /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

# Upstream servers
upstream node_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

upstream flask_ai {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;    # ← Replace with your domain or Elastic IP

    # Redirect HTTP to HTTPS (uncomment when SSL is set up)
    # return 301 https://$server_name$request_uri;

    # ── Gzip compression ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ── Frontend (static files) ──
    location / {
        root /var/www/eventsphere/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Node.js API ──
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # ── Socket.IO (CRITICAL: needs proper websocket proxy) ──
    location /socket.io/ {
        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Static uploads ──
    location /uploads/ {
        alias /var/www/eventsphere/backend-node/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Health check ──
    location /health {
        proxy_pass http://node_backend/health;
        access_log off;
    }

    # ── Block sensitive files ──
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~ \.env$ {
        deny all;
        return 404;
    }
}

