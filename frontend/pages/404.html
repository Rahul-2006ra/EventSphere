<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — EventSphere</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <script>
    tailwind.config = {
      darkMode:'class',
      theme:{ extend:{
        fontFamily:{ display:['Syne','sans-serif'], body:['DM Sans','sans-serif'] },
        colors:{ primary:{ DEFAULT:'#6366f1', light:'#818cf8' }, surface:{ DEFAULT:'#0f0f1a', card:'#161625', border:'#1e1e35' } }
      }}
    };
  </script>
</head>
<body class="bg-surface text-white font-body antialiased min-h-screen flex items-center justify-center p-4">
  <div class="text-center max-w-md">
    <div class="font-display text-8xl font-black gradient-text mb-4">404</div>
    <h1 class="font-display text-2xl font-bold mb-3">Page not found</h1>
    <p class="text-slate-400 mb-8">The page you're looking for doesn't exist or has been moved.</p>
    <div class="flex gap-3 justify-center">
      <a href="/" class="btn-primary">Back to Home</a>
      <button onclick="history.back()" class="btn-secondary">Go Back</button>
    </div>
  </div>
</body>
</html>
